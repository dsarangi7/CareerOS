[project]
name = "career-os"
version = "0.1.0"
description = "Personal Career Intelligence System"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "sqlalchemy>=2",
  "alembic",
  "pydantic>=2",
  "pydantic-settings",
  "uvicorn",
  "streamlit",
  "jinja2",
  "pytest",
  "ruff",
  "mypy",
  "pandas",
  "openpyxl",
  "plotly",
  "pypdf",
  "pre-commit",
  "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
