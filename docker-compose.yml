services:
  api:
    build: .
    command: python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    environment:
      CAREEROS_DATABASE_URL: sqlite:////workspace/career_os.db
  dashboard:
    build: .
    command: python -m streamlit run dashboard/Home.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - .:/workspace
    environment:
      CAREEROS_DATABASE_URL: sqlite:////workspace/career_os.db
